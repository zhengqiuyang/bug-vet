[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-vet"
version = "0.4.1"
description = "Vet silent contract bugs with executable red/green proof, structural oracles, adversarial falsification, and a zero-dep MCP dual surface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhengqiuyang" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bug-vet = "bug_vet.cli:main"
bugvet = "bug_vet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bug_vet = [
    "templates/*.tmpl",
    "playbooks/*.md",
    "playbooks/*.json",
    "plugin/*.json",
    "plugin/*.md",
    "plugin/agents/*.md",
    "plugin/rules/*.md",
    "plugin/skills/*/SKILL.md",
    "plugin/assets/*.svg",
    "plugin/hooks/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
