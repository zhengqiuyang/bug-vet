[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-vet"
version = "0.4.1"
description = "Vet silent contract bugs with executable red/green proof, structural oracles, adversarial falsification, and a zero-dep MCP dual surface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhengqiuyang" }]
keywords = [
    "testing",
    "static-analysis",
    "contract-testing",
    "mcp",
    "ai-agents",
    "sarif",
    "bug-finding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zhengqiuyang/bug-vet"
Repository = "https://github.com/zhengqiuyang/bug-vet"
Issues = "https://github.com/zhengqiuyang/bug-vet/issues"
Changelog = "https://github.com/zhengqiuyang/bug-vet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bug-vet = "bug_vet.cli:main"
bugvet = "bug_vet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bug_vet = [
    "templates/*.tmpl",
    "playbooks/*.md",
    "playbooks/*.json",
    "plugin/*.json",
    "plugin/*.md",
    "plugin/agents/*.md",
    "plugin/rules/*.md",
    "plugin/skills/*/SKILL.md",
    "plugin/assets/*.svg",
    "plugin/hooks/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
