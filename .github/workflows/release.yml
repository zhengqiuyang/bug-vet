name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Verify Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build & test dependencies
        run: python -m pip install -e ".[dev]" build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from bug_vet import __version__

          ref_name = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if ref_name != expected:
              print(f"Tag {ref_name!r} does not match package __version__ {expected!r}", file=sys.stderr)
              sys.exit(1)
          print(f"Verified tag matches version {expected}")
          PY
      - name: Run full test suite
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Smoke-test standalone wheel install
        shell: bash
        run: |
          python -m venv /tmp/rel-venv
          /tmp/rel-venv/bin/python -m pip install --no-deps dist/*.whl
          (
            cd /tmp
            /tmp/rel-venv/bin/bug-vet --version
            /tmp/rel-venv/bin/bug-vet playbook --list
            /tmp/rel-venv/bin/bug-vet setup --client antigravity --apply --plugin-dir /tmp/rel-plugin
          )
          test -f /tmp/rel-plugin/plugin.json
          test -f /tmp/rel-plugin/mcp_config.json
          test -f /tmp/rel-plugin/hooks.json
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
