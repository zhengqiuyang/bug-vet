name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Wheel ships and installs the plugin bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          python -m pip wheel . -w dist --no-deps
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "bug_vet/templates/python_probe.py.tmpl",
              "bug_vet/playbooks/index.json",
              "bug_vet/plugin/plugin.json",
              "bug_vet/plugin/hooks.json",
              "bug_vet/plugin/hooks/guard_probe_vacuity.py",
              "bug_vet/plugin/hooks/guard_local_only.py",
              "bug_vet/plugin/skills/bug-vet-hunt/SKILL.md",
          ]
          missing = [item for item in required if item not in names]
          print("missing from wheel:", missing)
          sys.exit(1 if missing else 0)
          PY
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          (
            cd /tmp
            /tmp/wheel-venv/bin/bug-vet --version
            /tmp/wheel-venv/bin/bug-vet playbook --list
            /tmp/wheel-venv/bin/bug-vet setup --client antigravity --apply --plugin-dir /tmp/wheel-plugin
          )
          test -f /tmp/wheel-plugin/plugin.json
          test -f /tmp/wheel-plugin/mcp_config.json
          test -f /tmp/wheel-plugin/hooks.json
