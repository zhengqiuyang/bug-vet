name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Wheel ships the plugin bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          python -m pip wheel . -w dist --no-deps
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "bug_vet/plugin/plugin.json",
              "bug_vet/plugin/hooks.json",
              "bug_vet/plugin/hooks/guard_probe_vacuity.py",
              "bug_vet/plugin/hooks/guard_local_only.py",
              "bug_vet/plugin/skills/bug-vet-hunt/SKILL.md",
          ]
          missing = [item for item in required if item not in names]
          print("missing from wheel:", missing)
          sys.exit(1 if missing else 0)
          PY
