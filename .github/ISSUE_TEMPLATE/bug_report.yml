name: Bug Report
description: Report a bug in bug-vet (false-positive finding, runner/ledger issue, hook edge case, or CLI/MCP error)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: bug-vet version
      description: Output of `bug-vet --version`
      placeholder: "bug-vet 0.4.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: "Windows 11 / Python 3.12.10"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (command or self_check() probe)
      description: Provide the smallest command, AST snippet, or standalone probe that demonstrates the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: Describe what bug-vet should have done vs what happened.
    validations:
      required: true
